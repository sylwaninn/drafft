name: Drafft
options:
  bundleIdPrefix: so.drafft
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Staging: Release-optimised build on the staging backend (Debug stalls on device, so it's not a Debug copy).
configs:
  Debug: debug
  Release: release
  Staging: release
  Local: release
fileGroups:
  # Backend per build configuration (Release: production; Debug and Staging: staging; Local: this Mac).
  - Config
  # Local App Store for testing purchases in the Simulator (not shipped in the app).
  - StoreKit
packages:
  # On-device cache of the last known state (SQLite), per account.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
  # Remote and picked photos: background decoding at display size, capped caches, shared downloads.
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.0
  # Phone numbers of every country: parsing, validation (mobile lines) and formatting, from Google's
  # libphonenumber metadata. Pinned: a metadata update changes what the phone step accepts.
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit
    exactVersion: 4.3.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.91.0
  # Chat: Stream's low-level client only (connection, offline store, channels, messages, reactions,
  # typing, reads); every screen is drafft's own. Pinned: the client and the Stream app evolve together.
  StreamChat:
    url: https://github.com/GetStream/stream-chat-swift
    exactVersion: 5.12.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4F4J2C4L9W
    CODE_SIGN_STYLE: Automatic
targets:
  Drafft:
    type: application
    platform: iOS
    sources:
      # Includes Drafft/PrivacyInfo.xcprivacy, copied as a resource: keep its API reasons and collected
      # data in step with the code (App Store privacy manifest).
      - path: Drafft
    dependencies:
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: PhoneNumberKit
        product: PhoneNumberKit
      - package: RevenueCat
        product: RevenueCat
      - package: StreamChat
        product: StreamChat
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
      Staging: Config/Staging.xcconfig
      Local: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.drafft.app
        CODE_SIGN_ENTITLEMENTS: Drafft/Drafft.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: Launch
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: drafft uses the microphone to record voice messages and your voice intro.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: drafft lets you share photos and videos in chat and add them to your profile.
        INFOPLIST_KEY_NSCameraUsageDescription: drafft uses your camera for photos in your profile and chats, and for the selfie that confirms it's you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: drafft uses your location to show people near you. Others see your area and a rounded distance, never your address.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: drafft keeps the sessions you add to your calendar up to date, and removes them if they're cancelled.
    info:
      path: Drafft/Info.plist
      properties:
        UIAppFonts:
          - InterDisplay-Black.ttf
          - InterDisplay-ExtraBold.ttf
        # The first frame of SplashView: the night surface and the white word where SplashView
        # draws it (a storyboard: UILaunchScreen can only centre its image). iOS caches the launch
        # screen by these names, even across a reinstall: rename the storyboard and its assets
        # whenever they change, or phones keep showing the old one.
        UILaunchStoryboardName: Launch
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Read by BackendConfig; values from Config/*.xcconfig.
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        SmsCodeLifetime: $(SMS_CODE_LIFETIME)
        TurnstileSiteKey: $(TURNSTILE_SITE_KEY)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, de, it, pt, nl]
        NSLocationDefaultAccuracyReduced: true
  # Logic tests without the app (no host, no backend): the pieces that stand alone.
  DrafftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrafftTests
      - path: Drafft/Services/Cache/LocalCache.swift
      - path: Drafft/Services/PushTokenRegistration.swift
      - path: Drafft/Services/Media/ThumbHash.swift
      - path: Drafft/Services/Sessions/SessionLedger.swift
      - path: Drafft/Services/Backend/ProfileCard.swift
      - path: Drafft/Services/Chat/ChatPayload.swift
      - path: Drafft/Features/Me/SubscriptionNotice.swift
      - path: Drafft/Features/Auth/LegalDocs.swift
      - path: Drafft/Models/AppLanguage.swift
      - path: Drafft/Services/Backend/TermsConsent.swift
      - path: Drafft/Services/Backend/ServerMessage.swift
      - path: Drafft/Services/OnboardingProgress.swift
      - path: Drafft/Services/PhoneCountry.swift
      - path: Drafft/Services/LikeAge.swift
    dependencies:
      - package: GRDB
        product: GRDB
      - package: PhoneNumberKit
        product: PhoneNumberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.drafft.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Drafft:
    build:
      targets:
        Drafft: all
    run:
      # Release: Debug builds stall on device. The StoreKit file is only used when Xcode
      # launches the app (Run), never from the home screen, TestFlight or the App Store.
      config: Release
      storeKitConfiguration: StoreKit/Drafft.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Same app on the staging backend ("drafft β" on the home screen). Archive it for TestFlight testers
  # who should never touch production data.
  Drafft Staging:
    build:
      targets:
        Drafft: all
    # No local StoreKit file: purchases go through Apple's Sandbox, RevenueCat "drafft staging" and its
    # webhook, like production.
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Debug
    archive:
      config: Staging
  # Local Supabase (drafft-backend `supabase start`, then scripts/local-backend.sh) with the staging services
  # ("drafft local" on the home screen). Release-optimised like the others: Debug builds stall on device.
  # No local StoreKit file: purchases go through Apple's Sandbox and RevenueCat "drafft staging".
  # Every action uses Local: XcodeGen's defaults (Debug for test, Release for archive) would point this
  # scheme at the staging or production backend.
  Drafft Local:
    build:
      targets:
        Drafft: all
        DrafftTests: [test]
    run:
      config: Local
    test:
      config: Local
      targets:
        - DrafftTests
    profile:
      config: Local
    analyze:
      config: Local
    archive:
      config: Local

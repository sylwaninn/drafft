name: Drafft
options:
  bundleIdPrefix: so.drafft
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Staging: Release-optimised build on the staging backend (Debug stalls on device, so it's not a Debug copy).
configs:
  Debug: debug
  Release: release
  Staging: release
  Local: release
fileGroups:
  # Backend per build configuration (Release: production; Debug and Staging: staging; Local: this Mac).
  - Config
  # Local App Store for testing purchases in the Simulator (not shipped in the app).
  - StoreKit
packages:
  # Phone numbers of every country: parsing, validation (mobile lines) and formatting, from Google's
  # libphonenumber metadata. Pinned: a metadata update changes what the phone step accepts.
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit
    exactVersion: 4.3.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.91.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4F4J2C4L9W
    CODE_SIGN_STYLE: Automatic
targets:
  Drafft:
    type: application
    platform: iOS
    sources:
      # Includes Drafft/PrivacyInfo.xcprivacy, copied as a resource: keep its API reasons and collected
      # data in step with the code (App Store privacy manifest).
      - path: Drafft
    dependencies:
      - package: PhoneNumberKit
        product: PhoneNumberKit
      - package: RevenueCat
        product: RevenueCat
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
      Staging: Config/Staging.xcconfig
      Local: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: so.drafft.app
        CODE_SIGN_ENTITLEMENTS: Drafft/Drafft.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: drafft uses the microphone to record voice messages and your voice intro.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: drafft lets you share photos and videos in chat and add them to your profile.
        INFOPLIST_KEY_NSCameraUsageDescription: drafft uses your camera for photos in your profile and chats, and for the selfie that confirms it's you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: drafft shows your area, never your address, and rounds distances.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: drafft keeps the sessions you add to your calendar up to date, and removes them if they're cancelled.
    info:
      path: Drafft/Info.plist
      properties:
        UIAppFonts:
          - InterDisplay-Black.ttf
          - InterDisplay-ExtraBold.ttf
        # The first frame of SplashView: page tone and the word, centred (the relief then forms).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # Read by BackendConfig; values from Config/*.xcconfig.
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        SmsCodeLifetime: $(SMS_CODE_LIFETIME)
        TurnstileSiteKey: $(TURNSTILE_SITE_KEY)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, de, it, pt, nl]
        NSLocationDefaultAccuracyReduced: true
schemes:
  Drafft:
    build:
      targets:
        Drafft: all
    run:
      # Release: Debug builds stall on device. The StoreKit file is only used when Xcode
      # launches the app (Run), never from the home screen, TestFlight or the App Store.
      config: Release
      storeKitConfiguration: StoreKit/Drafft.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Same app on the staging backend ("drafft β" on the home screen). Archive it for TestFlight testers
  # who should never touch production data.
  Drafft Staging:
    build:
      targets:
        Drafft: all
    # No local StoreKit file: purchases go through Apple's Sandbox, RevenueCat "drafft staging" and its
    # webhook, like production.
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Debug
    archive:
      config: Staging
  # Local Supabase (drafft-backend `supabase start`, then scripts/local-backend.sh) with the staging services
  # ("drafft local" on the home screen). Release-optimised like the others: Debug builds stall on device.
  # No local StoreKit file: purchases go through Apple's Sandbox and RevenueCat "drafft staging".
  # Every action uses Local: XcodeGen's defaults (Debug for test, Release for archive) would point this
  # scheme at the staging or production backend.
  Drafft Local:
    build:
      targets:
        Drafft: all
    run:
      config: Local
    test:
      config: Local
    profile:
      config: Local
    analyze:
      config: Local
    archive:
      config: Local
